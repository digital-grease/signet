# F-Droid build metadata for Signet.
#
# This file is the canonical source for the YAML that ends up at
#   metadata/dev.digitalgrease.signet.yml
# in https://gitlab.com/fdroid/fdroiddata.
#
# When filing a new fdroiddata MR, copy this file directly. F-Droid's
# build server clones SourceCode, checks out `commit`, and runs the
# `build:` recipe to reproduce the APK.
#
# Localized listing content (descriptions, screenshots, changelog) is
# auto-imported from this repo's `fastlane/metadata/android/en-US/`
# directory on each release tag. Do NOT duplicate that content into the
# fdroiddata MR — F-Droid pulls it directly.
#
# Fields the owner updates per release:
#   Builds[] — versionName, versionCode, commit (SHA, not tag name)
#   CurrentVersion / CurrentVersionCode

Categories:
  - Phone & SMS
  - Security
License: AGPL-3.0-only
AuthorName: digital-grease
AuthorEmail: dg@digitalgrease.net
WebSite: https://github.com/digital-grease/signet
SourceCode: https://github.com/digital-grease/signet
IssueTracker: https://github.com/digital-grease/signet/issues
Donate: https://www.buymeacoffee.com/digitalgrease

AutoName: Signet

RepoType: git
Repo: https://github.com/digital-grease/signet.git

Builds:
  - versionName: 0.3.1
    versionCode: 30001
    # Owner: replace with full SHA from `git rev-parse v0.3.1^{commit}`
    # before filing the fdroiddata MR. Tag-name commits work for local
    # `fdroid build` testing but fdroiddata convention prefers SHA.
    commit: v0.3.1
    sudo:
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - update-java-alternatives -s java-1.17.0-openjdk-amd64
    srclibs:
      - flutter@3.41.6
    rm:
      - ios
    output: build/app/outputs/flutter-apk/app-release.apk
    build:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter packages pub get
      - $$flutter$$/bin/flutter build apk --release

# AllowedAPKSigningKeys intentionally omitted: F-Droid signs with their
# own key. Cross-channel migration (Play <-> F-Droid) is handled by
# the in-app BackupBundle export/import, not by signature compatibility.

# Auto-update via tag detection. F-Droid's daily checkupdates job:
#   1. Detects new vX.Y.Z tags on digital-grease/signet (leading `v` is
#      auto-stripped by the Tags-mode parser; same pattern as the
#      Flutter app `agersant.polaris`).
#   2. Reads pubspec.yaml at the tag, extracts versionCode + versionName
#      via UpdateCheckData regex.
#   3. Auto-promotes a new Builds[] entry on fdroiddata/master.
# No further manual fdroiddata MRs needed for content updates.
AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.3.1
CurrentVersionCode: 30001

# Anti-features: none. Signet has no ads, no tracking, no proprietary
# deps (the v0.3.0 mobile_scanner ML Kit issue is fixed in v0.3.1 by
# the swap to flutter_zxing). If a future release introduces something
# that triggers an Anti-feature, declare here per
# https://f-droid.org/docs/Anti-Features/
# AntiFeatures: []
