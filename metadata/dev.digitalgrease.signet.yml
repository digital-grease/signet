# F-Droid build metadata for Signet.
#
# This file is the canonical source for the YAML that ends up at
#   metadata/dev.digitalgrease.signet.yml
# in https://gitlab.com/fdroid/fdroiddata.
#
# When filing a new fdroiddata MR, copy this file directly. F-Droid's
# build server clones SourceCode, checks out `commit`, and runs the
# `build:` recipe to reproduce the APK.
#
# Localized listing content (descriptions, screenshots, changelog) is
# auto-imported from this repo's `fastlane/metadata/android/en-US/`
# directory on each release tag. Do NOT duplicate that content into the
# fdroiddata MR — F-Droid pulls it directly.
#
# Per-ABI build splits per fdroiddata's templates/build-flutter.yml
# convention. Each ABI gets its own Builds[] entry with a versionCode
# computed as `pubspec-versionCode * 10 + abi-suffix`. The gradle
# override in `android/app/build.gradle.kts` matches this scheme so
# the on-APK versionCode equals the YAML's declared versionCode.
#
# Flutter version pinning: the `srclibs: flutter@stable` clone starts
# at whatever revision F-Droid's flutter srclib currently points at;
# the prebuild block then extracts the canonical version from this
# repo's .github/workflows/release.yml (the `flutter-version: 'X.Y.Z'`
# literal on the main release-build step) and `git checkout` forces
# srclibs to that revision. Single source of truth = release.yml.
#
# Fields the owner updates per release:
#   Builds[].commit (full SHA, not tag name)
#   Builds[].versionName + .versionCode  (× 3 ABI entries)
#   CurrentVersion / CurrentVersionCode  (highest ABI versionCode)

Categories:
  - Phone & SMS
  - Security
License: AGPL-3.0-only
AuthorName: digital-grease
AuthorEmail: dg@digitalgrease.net
WebSite: https://github.com/digital-grease/signet
SourceCode: https://github.com/digital-grease/signet
IssueTracker: https://github.com/digital-grease/signet/issues
Donate: https://www.buymeacoffee.com/digitalgrease

AutoName: Signet

RepoType: git
Repo: https://github.com/digital-grease/signet.git

Builds:
  - versionName: 0.3.3
    versionCode: 300031
    commit: d9f2d7c593e6021d91a88d2f1e70030f04ab09d3
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm

  - versionName: 0.3.3
    versionCode: 300032
    commit: d9f2d7c593e6021d91a88d2f1e70030f04ab09d3
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm64

  - versionName: 0.3.3
    versionCode: 300033
    commit: d9f2d7c593e6021d91a88d2f1e70030f04ab09d3
    output: build/app/outputs/flutter-apk/app-x86_64-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
