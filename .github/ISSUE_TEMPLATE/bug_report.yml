name: Bug report
description: Something works incorrectly but the app didn't crash (broken button, wrong words, UI glitch, etc.)
title: "Bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For app crashes (with a stack trace), please use the **Crash report** form instead — it has the right fields and dedup hints.

        Quick checks:
        - Is this already fixed in the latest version? See the [releases page](https://github.com/digital-grease/signet/releases).
        - Is your question answered by the [FAQ](https://github.com/digital-grease/signet#faq)?

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Google Pixel 7 Pro
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: OS version
      description: Android or iOS major version. API level is fine if that's what you know.
      placeholder: "14"
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: Signet version
      placeholder: 0.3.3 (4)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Best guess of what part of the app this affects. The auto-labeler reads this to tag the issue.
      options:
        - pairing
        - verify
        - liveness
        - backup
        - scanner
        - crypto
        - ui
        - storage
        - other
    validations:
      required: false

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      placeholder: Describe what you saw.
    validations:
      required: true

  - type: textarea
    id: what_expected
    attributes:
      label: What did you expect to happen?
      placeholder: Describe what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can someone else reproduce this? Numbered steps are great.
      placeholder: |
        1. Open Signet
        2. Tap …
        3. …
    validations:
      required: false
