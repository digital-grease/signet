name: Instrumented Tests

# integration_test/ on an Android emulator: the real Keystore behind
# flutter_secure_storage, the real clipboard channel and the whole app,
# none of which the `flutter test` unit and widget suite in ci.yml touches.
# Emulator runs are slow (the clipboard tests alone wait out three
# one-minute timers), so they do not gate every pull request: they run
# nightly, on demand, on pull requests that change these tests or this
# workflow, and, via workflow_call, as a release gate (see release.yml).
#
# Debug builds only: `flutter test` cannot run a release (R8) build, so
# release-only failures stay a manual pre-release check (README pre-release
# checklist).
on:
  schedule:
    - cron: '0 5 * * *'   # nightly, 05:00 UTC
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - 'integration_test/**'
      - '.github/workflows/instrumented-tests.yml'

# A newer run for the same ref supersedes an in-flight one; release runs
# (tag refs) are never cancelled.
concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: 3.47.5
  FLUTTER_CHANNEL: stable
  JAVA_VERSION: 21

permissions:
  contents: read

jobs:
  instrumented:
    name: Instrumented (API ${{ matrix.api-level }})
    # Pinned to 22.04, as in fauxx: on the ubuntu-24.04 image the AVD can
    # stay "offline" and never finish booting under android-emulator-runner.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 28 is minSdk (the oldest Keystore Signet supports); 34 a current one.
        api-level: [28, 34]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The emulator is unusably slow on the runner without /dev/kvm.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}

      - name: Install dependencies
        run: flutter pub get

      - name: Run integration tests on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          cores: 4
          emulator-boot-timeout: 900
          disable-animations: true
          # One line per shell: the runner runs each line on its own. The
          # logcat is kept for the failure artifact below.
          script: |
            flutter test integration_test -d emulator-5554 --reporter expanded || (adb logcat -d > logcat.txt; exit 1)

      - name: Upload logcat on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instrumented-logcat-api${{ matrix.api-level }}
          path: logcat.txt
          retention-days: 14
          if-no-files-found: ignore
