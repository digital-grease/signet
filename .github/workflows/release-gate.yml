name: Release Gate

# Fails when pubspec.yaml's version line, CHANGELOG.md, fastlane changelogs, or
# the Play whats-new file are modified without an explicit "release:"-prefixed
# commit subject in the push/PR range. Also enforces that version bumps and
# matching fastlane changelog files land together.
#
# Rationale: pubspec.yaml's version line is what F-Droid's checkupdates bot
# reads (via UpdateCheckData) to detect a new release, and fastlane changelogs +
# whats-new.txt are what Play / F-Droid surface as release notes. Accidentally
# bumping any of these (e.g. a stale staged change carried into a code-only
# push) ships a half-baked release. This job is the audit-trail alarm so the
# desync is loud, not silent.
#
# To intentionally release: make the version-bump commit subject start with
#   release: v<X.Y.Z> — <short note>
# or "release(scope):" if a scope is useful (conventional-commits style).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only — this workflow only inspects file diffs and commit subjects.
permissions:
  contents: read

jobs:
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine compare range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            base="${{ github.event.before }}"
            # First push to a new branch reports all-zero SHA; fall back to parent.
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="${{ github.sha }}^"
            fi
            echo "base=$base" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect release-related file changes
        id: detect
        run: |
          base="${{ steps.range.outputs.base }}"
          head="${{ steps.range.outputs.head }}"
          changed=$(git diff --name-only "$base" "$head")
          echo "Changed files in $base..$head:"
          echo "$changed"

          version_touched=false
          changelog_touched=false
          whatsnew_touched=false
          repo_changelog_touched=false

          # pubspec.yaml only counts if the `version:` line itself changed.
          # Plain dep bumps to pubspec shouldn't trip the gate.
          if echo "$changed" | grep -qx "pubspec.yaml"; then
            if git diff --unified=0 "$base" "$head" -- pubspec.yaml | grep -qE '^\+version:'; then
              version_touched=true
            fi
          fi
          if echo "$changed" | grep -qE "^fastlane/metadata/android/[^/]+/changelogs/[0-9]+\.txt$"; then
            changelog_touched=true
          fi
          if echo "$changed" | grep -qx "distribution/play-store/whats-new.txt"; then
            whatsnew_touched=true
          fi
          if echo "$changed" | grep -qx "CHANGELOG.md"; then
            repo_changelog_touched=true
          fi
          echo "version_touched=$version_touched" >> "$GITHUB_OUTPUT"
          echo "changelog_touched=$changelog_touched" >> "$GITHUB_OUTPUT"
          echo "whatsnew_touched=$whatsnew_touched" >> "$GITHUB_OUTPUT"
          echo "repo_changelog_touched=$repo_changelog_touched" >> "$GITHUB_OUTPUT"

      - name: Require release-prefixed commit
        if: |
          steps.detect.outputs.version_touched == 'true' ||
          steps.detect.outputs.changelog_touched == 'true' ||
          steps.detect.outputs.whatsnew_touched == 'true' ||
          steps.detect.outputs.repo_changelog_touched == 'true'
        run: |
          base="${{ steps.range.outputs.base }}"
          head="${{ steps.range.outputs.head }}"
          subjects=$(git log --format=%s "$base..$head")
          echo "Commit subjects in range:"
          echo "$subjects"

          if echo "$subjects" | grep -qiE '^release(\([^)]+\))?:'; then
            echo "Found release-prefixed commit — gate satisfied."
            exit 0
          fi

          echo "::error::Release-related files were modified, but no commit subject in this range starts with 'release:'."
          echo "::error::"
          if [ "${{ steps.detect.outputs.version_touched }}" = "true" ]; then
            echo "::error::  - pubspec.yaml version line was touched"
          fi
          if [ "${{ steps.detect.outputs.changelog_touched }}" = "true" ]; then
            echo "::error::  - a fastlane/metadata/.../changelogs/<code>.txt file was touched"
          fi
          if [ "${{ steps.detect.outputs.whatsnew_touched }}" = "true" ]; then
            echo "::error::  - distribution/play-store/whats-new.txt was touched"
          fi
          if [ "${{ steps.detect.outputs.repo_changelog_touched }}" = "true" ]; then
            echo "::error::  - CHANGELOG.md was touched"
          fi
          echo "::error::"
          echo "::error::If this is intentional, retitle the version-bump commit (git commit --amend, or"
          echo "::error::interactive rebase) so the subject starts with 'release:'. Example:"
          echo "::error::  release: v0.3.4 — in-app crash dialog, log-to-issue shipping"
          echo "::error::"
          echo "::error::If this was accidental (a stale staged change), revert the file(s) and push the revert."
          exit 1

      - name: Ensure version bump and changelog stay in sync
        if: |
          steps.detect.outputs.version_touched == 'true' ||
          steps.detect.outputs.changelog_touched == 'true'
        run: |
          base="${{ steps.range.outputs.base }}"
          head="${{ steps.range.outputs.head }}"
          version_touched="${{ steps.detect.outputs.version_touched }}"
          changelog_touched="${{ steps.detect.outputs.changelog_touched }}"

          if [ "$version_touched" = "true" ] && [ "$changelog_touched" = "false" ]; then
            # Extract the new versionCode from pubspec.yaml: `version: X.Y.Z+CODE` → CODE
            new_code=$(git show "$head:pubspec.yaml" | sed -nE 's/^version: [0-9]+\.[0-9]+\.[0-9]+\+([0-9]+)$/\1/p')
            echo "::error::pubspec.yaml version line was bumped (versionCode=$new_code) but no fastlane changelog was added in this range."
            echo "::error::Add fastlane/metadata/android/en-US/changelogs/$new_code.txt with the release notes,"
            echo "::error::then amend/push again. F-Droid surfaces this file as the release notes blurb."
            exit 1
          fi

          if [ "$version_touched" = "false" ] && [ "$changelog_touched" = "true" ]; then
            echo "::error::A fastlane changelog was added/modified, but pubspec.yaml's version line was not bumped."
            echo "::error::Changelogs without a corresponding version bump won't surface anywhere."
            echo "::error::Either bump pubspec.yaml's version line to the matching versionCode, or revert the changelog."
            exit 1
          fi

          echo "Version + changelog in sync."
