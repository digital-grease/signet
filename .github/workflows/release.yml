name: Release

# Fires only on version tags matching `v<major>.<minor>.<patch>` (with
# optional pre-release suffix like `-alpha.1`). Pushing a tag triggers
# a signed Android AAB + APK build + unsigned iOS .app build, then
# creates a GitHub Release with all artifacts + SHA-256 checksums.
#
# Two Android formats are produced and attached to each release:
#   - AAB (.aab) — Play Console requires this for new-app submissions
#                  since Aug 2021. Upload this at Play Console →
#                  Testing → Internal testing → Create new release.
#   - APK (.apk) — F-Droid submissions (F-Droid rebuilds from source
#                  but the fingerprint in AllowedAPKSigningKeys comes
#                  from our signed APK) + any direct sideload channel
#                  (GitHub Release download, manual install on the
#                  owner's test device). Play Console will still
#                  accept APKs for *existing* apps but not new ones.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#
#   ANDROID_KEYSTORE_BASE64  — base64-encoded contents of your
#                              production .jks file. Generate once:
#                                base64 -w0 ~/keystores/signet-release.jks
#                              Paste the output as the secret value.
#   ANDROID_KEYSTORE_PASSWORD — the `-storepass` used when running keytool.
#   ANDROID_KEY_ALIAS         — the `-alias` used when running keytool
#                               (e.g. `signet`).
#   ANDROID_KEY_PASSWORD      — the `-keypass` if different from
#                               storepass; otherwise same as storepass.
#
# See docs/RELEASE.md (Task 12.16) for the full keystore generation
# + secret-setup + release-tagging playbook.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

# One release build per tag; cancel stale dispatches against the same
# ref. Intentionally aggressive — we don't want two concurrent signed
# builds publishing competing artifacts to the same Release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.6
  FLUTTER_CHANNEL: stable
  JAVA_VERSION: 17

jobs:
  build-android:
    name: Signed Android AAB + APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      aab-sha256: ${{ steps.checksum.outputs.aab_sha256 }}
      apk-sha256: ${{ steps.checksum.outputs.apk_sha256 }}

    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          # Pinned literal (not ${{ env.FLUTTER_VERSION }}) so F-Droid's
          # prebuild can extract via the exact regex from
          # fdroiddata/templates/build-flutter.yml lines 32-34:
          #   sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml
          # MUST stay in sync with FLUTTER_VERSION above and with the
          # second flutter-action step below.
          flutter-version: '3.41.6'
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}

      - name: Stage keystore + key.properties from secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::One or more release-signing secrets are unset."
            echo "::error::Set ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD."
            echo "::error::See .github/workflows/release.yml comment header for the recipe."
            exit 1
          fi
          # Write decoded keystore into the Android source tree. key.properties
          # points at this absolute path. Both files are removed in a
          # cleanup step below so they never persist in a cached layer.
          echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/android/release.jks"
          cat > "$GITHUB_WORKSPACE/android/key.properties" <<EOF
          storeFile=$GITHUB_WORKSPACE/android/release.jks
          storePassword=$KS_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build signed release AAB + APK
        run: |
          flutter build appbundle --release
          flutter build apk --release

      - name: Verify signatures are NOT debug
        # AAB and APK use different verification tools because of how
        # they are signed:
        #   - AAB is JAR-format (v1 jarsignatures). `keytool -printcert
        #     -jarfile` reads the owner DN + SHA-256 fingerprint.
        #   - APK in AGP 4.0+ defaults to APK Signature Scheme v2/v3
        #     only (no v1). keytool -jarfile returns "Not a signed jar
        #     file" against v2-only APKs — which previously made this
        #     check a false negative (grep matched nothing, test
        #     "passed" trivially even on a debug-signed APK). Use
        #     apksigner verify --print-certs instead; it handles v2+.
        # Both artifacts must resolve to a non-debug signer or we bail.
        run: |
          set -euo pipefail
          aab=build/app/outputs/bundle/release/app-release.aab
          apk=build/app/outputs/flutter-apk/app-release.apk

          echo "--- $aab (v1 jarsignature via keytool) ---"
          aab_cert=$(keytool -printcert -jarfile "$aab" | head -10)
          echo "$aab_cert"
          if [ -z "$aab_cert" ]; then
            echo "::error::$aab has no readable v1 jarsignature."
            exit 1
          fi
          if echo "$aab_cert" | grep -qi "CN=Android Debug"; then
            echo "::error::$aab was signed with the Android debug key."
            echo "::error::Production signing did not apply — check key.properties wiring."
            exit 1
          fi

          echo "--- $apk (APK Signature Scheme v2+ via apksigner) ---"
          # Android SDK build-tools ships apksigner; locate the newest
          # version available on the runner.
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools/."
            exit 1
          fi
          apk_out=$("$apksigner" verify --print-certs --verbose "$apk")
          echo "$apk_out"
          if ! echo "$apk_out" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"; then
            echo "::error::$apk did not verify under APK Signature Scheme v2."
            exit 1
          fi
          # apksigner output labels the signer differently depending on
          # which schemes matched. v2-only APKs print "V2 Signer:
          # certificate DN:"; v3+ print "Signer #1 certificate DN:".
          # Match either, and tolerate no-match (|| true) so pipefail
          # doesn't abort the script on a genuinely unusual output.
          signer_dn=$(echo "$apk_out" \
            | grep -iE "(Signer #1 certificate DN:|V[0-9]+ Signer: certificate DN:)" \
            | head -1 || true)
          if echo "$signer_dn" | grep -qi "CN=Android Debug"; then
            echo "::error::$apk was signed with the Android debug key."
            echo "::error::Production signing did not apply — check key.properties wiring."
            exit 1
          fi

      - name: Compute AAB + APK SHA-256
        id: checksum
        run: |
          aab=build/app/outputs/bundle/release/app-release.aab
          apk=build/app/outputs/flutter-apk/app-release.apk
          aab_sha=$(sha256sum "$aab" | awk '{print $1}')
          apk_sha=$(sha256sum "$apk" | awk '{print $1}')
          echo "aab_sha256=$aab_sha" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$apk_sha" >> "$GITHUB_OUTPUT"
          echo "$aab_sha  signet-${{ github.ref_name }}.aab" > "$aab.sha256"
          echo "$apk_sha  signet-${{ github.ref_name }}.apk" > "$apk.sha256"

      - name: Rename artifacts with tag
        id: rename
        run: |
          aab_src=build/app/outputs/bundle/release/app-release.aab
          apk_src=build/app/outputs/flutter-apk/app-release.apk
          aab_dst=build/app/outputs/bundle/release/signet-${{ github.ref_name }}.aab
          apk_dst=build/app/outputs/flutter-apk/signet-${{ github.ref_name }}.apk
          mv "$aab_src" "$aab_dst"
          mv "$aab_src.sha256" "$aab_dst.sha256"
          mv "$apk_src" "$apk_dst"
          mv "$apk_src.sha256" "$apk_dst.sha256"
          echo "aab-path=$aab_dst" >> "$GITHUB_OUTPUT"
          echo "aab-sha-path=$aab_dst.sha256" >> "$GITHUB_OUTPUT"
          echo "apk-path=$apk_dst" >> "$GITHUB_OUTPUT"
          echo "apk-sha-path=$apk_dst.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.ref_name }}
          path: |
            ${{ steps.rename.outputs.aab-path }}
            ${{ steps.rename.outputs.aab-sha-path }}
            ${{ steps.rename.outputs.apk-path }}
            ${{ steps.rename.outputs.apk-sha-path }}
          retention-days: 90
          if-no-files-found: error

      - name: Wipe keystore from workspace
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE/android/release.jks"
          rm -f "$GITHUB_WORKSPACE/android/key.properties"

  build-ios:
    name: iOS unsigned
    runs-on: macos-latest
    timeout-minutes: 40
    outputs:
      ios-sha256: ${{ steps.package.outputs.sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ~/.cocoapods/repos
          key: cocoapods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Pod install
        working-directory: ios
        run: pod install --verbose || { pod repo update && pod install; }

      - name: Build iOS unsigned
        run: flutter build ios --release --no-codesign

      - name: Package .app as zip
        id: package
        run: |
          cd build/ios/iphoneos
          zip -qr Runner.app.zip Runner.app
          sha=$(sha256sum Runner.app.zip | awk '{print $1}')
          mv Runner.app.zip signet-ios-${{ github.ref_name }}.zip
          echo "$sha  signet-ios-${{ github.ref_name }}.zip" > signet-ios-${{ github.ref_name }}.zip.sha256
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Upload iOS release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-${{ github.ref_name }}
          path: |
            build/ios/iphoneos/signet-ios-${{ github.ref_name }}.zip
            build/ios/iphoneos/signet-ios-${{ github.ref_name }}.zip.sha256
          retention-days: 90
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    # iOS is treated as best-effort (not gating) — the Android AAB + APK
    # are the critical-path artifacts for Play + F-Droid + direct install.
    # iOS ships via Xcode archive per docs/IOS_VALIDATION.md + plan Task
    # 13.21 anyway; the CI iOS job produces an unsigned verification
    # zip. If iOS compiles, we include it in the release; if it fails
    # (Flutter API shifts, Xcode upgrades on macos-latest, etc.) we
    # still publish Android. Android failure still gates everything.
    needs: [build-android, build-ios]
    if: always() && needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # `softprops/action-gh-release` writes to the Releases API — the
      # default GITHUB_TOKEN needs explicit `contents: write` scope.
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-release-${{ github.ref_name }}
          path: release-android

      - name: Download iOS artifact
        if: needs.build-ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ios-release-${{ github.ref_name }}
          path: release-ios

      - name: Assemble release body
        id: body
        run: |
          tag="${{ github.ref_name }}"
          {
            echo "## Signet $tag"
            echo ""
            echo "| Artifact | Use for | SHA-256 |"
            echo "|----------|---------|---------|"
            echo "| \`signet-$tag.aab\` | Play Console upload (required for new apps) | \`${{ needs.build-android.outputs.aab-sha256 }}\` |"
            echo "| \`signet-$tag.apk\` | F-Droid fingerprint source + direct sideload | \`${{ needs.build-android.outputs.apk-sha256 }}\` |"
            if [ "${{ needs.build-ios.result }}" = "success" ]; then
              echo "| \`signet-ios-$tag.zip\` | iOS archive (unsigned, verification only) | \`${{ needs.build-ios.outputs.ios-sha256 }}\` |"
            else
              echo "| _iOS build_ | _not included in this release (build job ${{ needs.build-ios.result }})_ | — |"
            fi
            echo ""
            echo "### Verify"
            echo ""
            echo '```sh'
            echo "sha256sum -c signet-$tag.aab.sha256"
            echo "sha256sum -c signet-$tag.apk.sha256"
            if [ "${{ needs.build-ios.result }}" = "success" ]; then
              echo "sha256sum -c signet-ios-$tag.zip.sha256"
            fi
            echo '```'
            echo ""
            echo "### Signing"
            echo ""
            echo "- **Android AAB + APK** — signed with the production upload key. Both have been verified to NOT be debug-signed."
            if [ "${{ needs.build-ios.result }}" = "success" ]; then
              echo "- **iOS .app.zip** — **unsigned** (for verification only; not installable without re-signing under your Apple Developer account)."
            else
              echo "- **iOS** — not in this release. Ship via Xcode archive per \`docs/IOS_VALIDATION.md\`."
            fi
            echo ""
            echo "### Notes"
            echo ""
            echo "Tag message:"
            echo ""
            echo '```'
            git tag -l --format='%(contents)' "$tag" || true
            echo '```'
          } > RELEASE_BODY.md
          echo "path=$PWD/RELEASE_BODY.md" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Signet ${{ github.ref_name }}
          body_path: ${{ steps.body.outputs.path }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-android/**/*
            release-ios/**/*
          # `**/*` recurses — the Android artifact download preserves the
          # Flutter build-output paths (`bundle/release/*.aab`,
          # `flutter-apk/*.apk`). A flat `release-android/*` silently
          # matches only the subdirs, dropping the actual binaries (hit
          # that in the v0.2.0 first publish — only sha256 siblings
          # landed, and those only because they were co-located with the
          # same nesting).
          # iOS artifact is best-effort — if build-ios failed, release-ios/
          # is absent. We don't want that to fail the release when Android
          # did ship.
          fail_on_unmatched_files: false
