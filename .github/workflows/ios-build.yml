name: iOS Build

# iOS builds cost 10× the runner-minute multiplier on private repos, so
# we only run them on `main` and release tags — not every PR. A
# workflow_dispatch trigger is available for on-demand runs when
# debugging iOS-specific work on a feature branch.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5
  FLUTTER_CHANNEL: stable

# Least-privilege default. Closes a CodeQL
# `actions/missing-workflow-permissions` finding.
permissions:
  contents: read

jobs:
  build-ios:
    name: iOS build (unsigned)
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}

      - name: Cache CocoaPods
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cocoapods/repos
          key: cocoapods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      - name: Report versions
        run: |
          flutter --version
          pod --version
          xcodebuild -version

      - name: Install dependencies
        run: flutter pub get

      - name: Pre-fetch iOS plugin pods
        # `flutter build ios` runs pod install internally, but doing it
        # explicitly gives better cache hit ratios and clearer error
        # messages when a plugin's podspec breaks.
        working-directory: ios
        run: |
          pod install --verbose || {
            echo "::warning::pod install failed on first attempt; trying --repo-update"
            pod repo update
            pod install
          }

      - name: Build iOS (release, no code signing)
        # `--no-codesign` builds the `.app` bundle but skips the
        # code-signing + IPA-packaging step that requires an Apple
        # Developer Program membership. A signed IPA for TestFlight /
        # App Store is a post-v1.0 concern; this workflow only proves
        # the iOS toolchain compiles our source.
        run: flutter build ios --release --no-codesign

      - name: Package .app as zip
        # Artifact names cannot contain "/" (or \ " : < > | * ?), and a
        # manual run from a branch like fix/x has one in its ref name. The
        # name is untrusted, so it comes in through the environment.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          safe_ref=$(printf '%s' "$REF_NAME" | tr '/\\":<>|*?' '-')
          echo "artifact=signet-ios-$safe_ref-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          cd build/ios/iphoneos
          if [ ! -d Runner.app ]; then
            echo "::error::Runner.app not produced by build"
            exit 1
          fi
          zip -qr Runner.app.zip Runner.app
          sha=$(sha256sum Runner.app.zip | awk '{print $1}')
          echo "$sha  Runner.app.zip" > Runner.app.zip.sha256
          echo "iOS Runner.app.zip SHA-256: $sha"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
        id: package

      - name: Upload .app bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            build/ios/iphoneos/Runner.app.zip
            build/ios/iphoneos/Runner.app.zip.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Summarize build
        # Untrusted (a branch or tag name can hold shell syntax): read from
        # the environment, never interpolated into the script.
        env:
          REF: ${{ github.ref }}
        run: |
          {
            echo "### iOS build (unsigned)"
            echo ""
            echo "- Flutter: ${{ env.FLUTTER_VERSION }}"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Ref: \`$REF\`"
            echo "- Runner.app.zip SHA-256: \`${{ steps.package.outputs.sha256 }}\`"
            echo "- Signing: **none** — for compile-verification only"
          } >> "$GITHUB_STEP_SUMMARY"
