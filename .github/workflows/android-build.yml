name: Android Build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.6
  FLUTTER_CHANNEL: stable
  # Android toolchain target — matches the JavaVersion in
  # android/app/build.gradle.kts.
  JAVA_VERSION: 17

# Least-privilege default. Closes a CodeQL
# `actions/missing-workflow-permissions` finding.
permissions:
  contents: read

jobs:
  build-android:
    name: Release AAB + APK (debug-signed)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          # First-run Gradle downloads + NDK cache eat ~30 min; cached
          # runs land in ~3 min. Keyed on build.gradle.kts so edits to
          # Android deps invalidate cleanly.
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}

      - name: Report versions
        run: |
          flutter --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Build release AAB + APK
        # No android/key.properties present → build.gradle.kts falls
        # back to debug signing. Production signing secrets are set up
        # in .github/workflows/release.yml (Task 12.4). Artifacts produced
        # here are for CI verification only; do NOT distribute.
        #
        # AAB first (Play Console's required format for new apps since
        # Aug 2021), then APK (F-Droid + direct-install channel). Both
        # formats are produced so the CI contract matches the release
        # workflow's output surface.
        run: |
          flutter build appbundle --release
          flutter build apk --release

      - name: Compute AAB + APK SHA-256
        id: checksum
        run: |
          aab=build/app/outputs/bundle/release/app-release.aab
          apk=build/app/outputs/flutter-apk/app-release.apk
          if [ ! -f "$aab" ]; then
            echo "::error::AAB not found at $aab"
            exit 1
          fi
          if [ ! -f "$apk" ]; then
            echo "::error::APK not found at $apk"
            exit 1
          fi
          aab_sha=$(sha256sum "$aab" | awk '{print $1}')
          apk_sha=$(sha256sum "$apk" | awk '{print $1}')
          echo "aab_sha256=$aab_sha" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$apk_sha" >> "$GITHUB_OUTPUT"
          echo "$aab_sha  app-release.aab" > build/app/outputs/bundle/release/app-release.aab.sha256
          echo "$apk_sha  app-release.apk" > build/app/outputs/flutter-apk/app-release.apk.sha256
          echo "AAB SHA-256: $aab_sha"
          echo "APK SHA-256: $apk_sha"

      - name: Upload AAB + APK + checksums
        uses: actions/upload-artifact@v4
        with:
          name: signet-android-${{ github.ref_name }}-${{ github.sha }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/app-release.aab.sha256
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Summarize build
        run: |
          {
            echo "### Android build"
            echo ""
            echo "- Flutter: ${{ env.FLUTTER_VERSION }}"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Ref: \`${{ github.ref }}\`"
            echo "- AAB SHA-256: \`${{ steps.checksum.outputs.aab_sha256 }}\`"
            echo "- APK SHA-256: \`${{ steps.checksum.outputs.apk_sha256 }}\`"
            echo "- Signing: debug key (not distributable)"
          } >> "$GITHUB_STEP_SUMMARY"
